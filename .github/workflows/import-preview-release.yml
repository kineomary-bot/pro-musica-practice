name: Import validated preview release

on:
  push:
    branches:
      - release/cloudflare-preview-2026-10-31

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/cloudflare-preview-2026-10-31
          fetch-depth: 0

      - name: Fetch validated test branch
        run: git clone --depth 1 --branch development https://github.com/kineomary-bot/pro-musica-practice-test.git /tmp/pro-musica-test

      - name: Import the complete tested app
        run: |
          rsync -a --delete /tmp/pro-musica-test/site/ site/
          rsync -a --delete /tmp/pro-musica-test/songs/ songs/
          rsync -a --delete /tmp/pro-musica-test/scripts/ scripts/
          cp /tmp/pro-musica-test/build.ps1 build.ps1
          cp /tmp/pro-musica-test/README.md README.md

      - name: Validate imported app
        run: node scripts/validate-site.mjs

      - name: Commit imported release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release content already matches the validated test branch."
            exit 0
          fi
          git commit -m "Import validated choir app release"
          git push origin HEAD:release/cloudflare-preview-2026-10-31
