name: Validate and package choir app

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

# Keep general repository permissions read-only; the deploy job receives the
# additional Pages permissions it needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate complete site bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site, catalogue, calendar and audio assets
        run: node scripts/validate-site.mjs

      - name: Package ready-to-publish site contents
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pro-musica-site-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14
      
  deploy:
    name: Publish live website to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
